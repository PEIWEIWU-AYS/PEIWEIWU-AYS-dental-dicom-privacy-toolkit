name: dental-demo-workflow
description: Reproducible synthetic dental DICOM privacy workflow.
steps:
  - id: create-synthetic
    action: synthetic
    output: input/sample.synthetic.dcm

  - id: filename-privacy-scan
    action: filename-scan
    input: input
    json: reports/filename-privacy.json
    html: reports/filename-privacy.html

  - id: inventory-input
    action: inventory
    input_dir: input
    json: reports/inventory.json
    csv: reports/inventory.csv
    html: reports/inventory.html

  - id: inspect-input
    action: inspect
    input: input/sample.synthetic.dcm
    json: reports/inspect.json
    html: reports/inspect.html

  - id: dicom-json-export
    action: dicom-json-export
    input: input/sample.synthetic.dcm
    json: reports/dicom-json.json
    html: reports/dicom-json.html

  - id: remediation-plan
    action: remediation-plan
    input: input
    profile: dental-basic
    json: reports/remediation-plan.json
    html: reports/remediation-plan.html

  - id: confidentiality-alignment
    action: confidentiality-alignment
    profile: dental-basic
    json: reports/confidentiality-alignment.json
    html: reports/confidentiality-alignment.html

  - id: dcmodify-plan
    action: dcmodify-plan
    input: input/sample.synthetic.dcm
    profile: dental-basic
    json: reports/dcmodify-plan.json
    html: reports/dcmodify-plan.html
    script: reports/dcmodify-plan.sh

  - id: anonymize
    action: anonymize
    input: input/sample.synthetic.dcm
    output: outputs/sample.anonymized.dcm
    profile: dental-basic
    audit: reports/audit.json
    html: reports/audit.html

  - id: profile-conformance
    action: profile-verify
    source: input/sample.synthetic.dcm
    anonymized: outputs/sample.anonymized.dcm
    profile: dental-basic
    json: reports/profile-conformance.json
    html: reports/profile-conformance.html

  - id: compare-deidentification
    action: compare-deid
    source: input/sample.synthetic.dcm
    anonymized: outputs/sample.anonymized.dcm
    json: reports/deid-comparison.json
    html: reports/deid-comparison.html

  - id: validate
    action: validate
    input: outputs/sample.anonymized.dcm
    json: reports/validation.json

  - id: pixel-risk-scan
    action: pixel-risk-scan
    input: outputs/sample.anonymized.dcm
    json: reports/pixel-risk.json
    html: reports/pixel-risk.html

  - id: preview-anonymized
    action: preview
    input: outputs/sample.anonymized.dcm
    output: reports/anonymized-preview.png
    json: reports/anonymized-preview.json

  - id: pixel-review
    action: pixel-review
    input: outputs/sample.anonymized.dcm
    out_dir: reports/pixel-review
    rects:
      - 1,0,1,1
    json: reports/pixel-review.json
    html: reports/pixel-review.html

  - id: redact-known-pixels
    action: redact-pixels
    input: outputs/sample.anonymized.dcm
    output: outputs/sample.redacted.dcm
    rects:
      - 1,0,1,1
    audit: reports/redaction.json

  - id: package
    action: package
    input_dir: outputs
    output: share/package.ddpt
    manifest: share/manifest.json
    encrypt: true
    key_out: share/package.key

  - id: verify-package
    action: verify-package
    package: share/package.ddpt
    key: share/package.key
    receipt: reports/package-receipt.json
    html: reports/package-receipt.html

  - id: audit-chain
    action: audit-chain
    root: .
    output: reports/audit-chain.json

  - id: audit-verify
    action: audit-verify
    manifest: reports/audit-chain.json
    json: reports/audit-chain-verify.json

  - id: share-readiness
    action: share-readiness
    root: .
    json: reports/share-readiness.json
    html: reports/share-readiness.html

  - id: deid-certificate
    action: certificate
    root: .
    json: reports/deid-certificate.json
    html: reports/deid-certificate.html

  - id: workflow-quality-gate
    action: quality-gate
    root: .
    json: reports/quality-gate.json
    html: reports/quality-gate.html
