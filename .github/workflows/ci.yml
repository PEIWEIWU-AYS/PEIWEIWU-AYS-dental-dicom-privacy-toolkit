name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Confirm repository skeleton
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f ROADMAP.md
          test -f docs/data-safety.md
          test -f docs/discoverability.md
          test -f docs/project-blueprint.md
          test -f docs/competitor-analysis.md
          test -f docs/product-requirements.md
          test -f docs/policy-registry.md
          test -f docs/demo-guide.md
          test -f docs/evidence-bundle.md
          test -f docs/workflow-recipes.md
          test -f docs/anonymization-dry-run.md
          test -f docs/macbook-validation.md
          test -f docs/safety-scan.md
          test -f docs/release-audit.md
          test -f docs/research-sharing-profile.md
          test -f docs/inventory.md
          test -f docs/preview.md
          test -f docs/pixel-redaction-plans.md
          test -f docs/tag-operations.md
          test -f docs/local-api.md
          test -f docs/audit-chain.md
          test -f docs/package-verification-receipts.md
          test -f profiles/dental-pixel-redaction.yml
          test -f profiles/dental-research-sharing.yml
          test -f recipes/dental-demo-workflow.yml
          test -f scripts/generate_demo_assets.py

      - name: Run environment doctor
        run: python -m ddpt doctor --json doctor.json

      - name: Run release readiness audit
        run: python -m ddpt release audit . --json release-audit.json --html release-audit.html

      - name: Run public repository safety scan
        run: python -m ddpt safety scan . --json safety-scan.json

      - name: Generate local evidence bundle
        run: python -m ddpt evidence bundle . --out evidence-run

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest
