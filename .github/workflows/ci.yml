name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Confirm repository skeleton
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f ROADMAP.md
          test -f docs/data-safety.md
          test -f docs/discoverability.md
          test -f docs/project-blueprint.md
          test -f docs/competitor-analysis.md
          test -f docs/product-requirements.md
          test -f docs/policy-registry.md

      - name: Run tests
        run: pytest
