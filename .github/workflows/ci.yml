name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm repository skeleton
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f ROADMAP.md
          test -f docs/data-safety.md
          test -f docs/discoverability.md
          test -f docs/project-blueprint.md
