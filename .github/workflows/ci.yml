name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Confirm repository skeleton
        run: |
          test -f README.md
          test -f LICENSE
          test -f CITATION.cff
          test -f ROADMAP.md
          test -f docs/data-safety.md
          test -f docs/discoverability.md
          test -f docs/dcmodify-plan.md
          test -f docs/project-blueprint.md
          test -f docs/competitor-analysis.md
          test -f docs/competitor-coverage.md
          test -f docs/product-requirements.md
          test -f docs/policy-registry.md
          test -f docs/remediation-plan.md
          test -f docs/demo-guide.md
          test -f docs/deid-certificate.md
          test -f docs/dicom-json-export.md
          test -f docs/evidence-bundle.md
          test -f docs/workflow-recipes.md
          test -f docs/quality-gate.md
          test -f docs/anonymization-dry-run.md
          test -f docs/macbook-validation.md
          test -f docs/safety-scan.md
          test -f docs/batch.md
          test -f docs/release-audit.md
          test -f docs/research-sharing-profile.md
          test -f docs/linkable-research-profile.md
          test -f docs/inventory.md
          test -f docs/preview.md
          test -f docs/pixel-review.md
          test -f docs/pixel-redaction-plans.md
          test -f docs/pixel-risk-scan.md
          test -f docs/tag-operations.md
          test -f docs/local-api.md
          test -f docs/local-workbench.md
          test -f docs/objective-completion-audit.md
          test -f docs/audit-chain.md
          test -f docs/package-verification-receipts.md
          test -f docs/profile-comparison.md
          test -f docs/profile-conformance.md
          test -f docs/profile-lint.md
          test -f docs/capability-matrix.md
          test -f docs/review-dashboard.md
          test -f docs/deid-comparison.md
          test -f docs/share-readiness.md
          test -f docs/synthetic-study.md
          test -f docs/filename-privacy-scan.md
          test -f profiles/dental-pixel-redaction.yml
          test -f profiles/dental-linkable-research.yml
          test -f profiles/dental-research-sharing.yml
          test -f recipes/dental-demo-workflow.yml
          test -f scripts/generate_demo_assets.py

      - name: Run environment doctor
        run: python -m ddpt doctor --json doctor.json

      - name: Run release readiness audit
        run: python -m ddpt release audit . --json release-audit.json --html release-audit.html

      - name: Run competitor-informed capability matrix
        run: python -m ddpt capability matrix --root . --json capability-matrix.json --html capability-matrix.html

      - name: Run competitor coverage report
        run: python -m ddpt competitor coverage --root . --json competitor-coverage.json --html competitor-coverage.html

      - name: Run original objective completion audit
        run: python -m ddpt completion audit . --json objective-audit.json --html objective-audit.html

      - name: Lint built-in anonymization profiles
        run: |
          python -m ddpt profile lint dental-basic --json profile-lint-basic.json
          python -m ddpt profile lint dental-research-sharing --json profile-lint-research.json
          python -m ddpt profile lint dental-linkable-research --json profile-lint-linkable.json

      - name: Run public repository safety scan
        run: python -m ddpt safety scan . --json safety-scan.json

      - name: Generate local evidence bundle
        run: python -m ddpt evidence bundle . --out evidence-run

      - name: Run de-identification comparison
        run: python -m ddpt compare deid evidence-run/demo-run/input/sample.synthetic.dcm evidence-run/demo-run/outputs/sample.anonymized.dcm --json deid-comparison.json --html deid-comparison.html

      - name: Run profile conformance verification
        run: python -m ddpt profile verify evidence-run/demo-run/input/sample.synthetic.dcm evidence-run/demo-run/outputs/sample.anonymized.dcm --profile dental-basic --json profile-conformance.json --html profile-conformance.html

      - name: Build de-identification certificate
        run: python -m ddpt certificate create evidence-run/demo-run --json deid-certificate.json --html deid-certificate.html

      - name: Run batch de-identification evidence
        run: python -m ddpt batch evidence-run/demo-run/input --out batch-run

      - name: Run privacy remediation plan
        run: python -m ddpt remediation plan evidence-run/demo-run/input --json remediation-plan.json --html remediation-plan.html

      - name: Run filename privacy scan
        run: python -m ddpt filename scan evidence-run/demo-run/input --json filename-privacy.json --html filename-privacy.html

      - name: Run dcmodify operation plan
        run: python -m ddpt dcmodify plan evidence-run/demo-run/input/sample.synthetic.dcm --json dcmodify-plan.json --html dcmodify-plan.html --script dcmodify-plan.sh

      - name: Run safe DICOM JSON export
        run: python -m ddpt dicom-json export evidence-run/demo-run/input/sample.synthetic.dcm --json dicom-json.json --html dicom-json.html

      - name: Run pixel risk scan
        run: python -m ddpt pixel-risk scan evidence-run/demo-run/outputs/sample.anonymized.dcm --json pixel-risk.json --html pixel-risk.html

      - name: Run share readiness gate
        run: python -m ddpt share readiness evidence-run/demo-run --json share-readiness.json --html share-readiness.html

      - name: Run workflow quality gate
        run: python -m ddpt quality gate evidence-run/demo-run --json quality-gate.json --html quality-gate.html

      - name: Build local review dashboard
        run: python -m ddpt dashboard build evidence-run --out evidence-run/reports/review-dashboard.html --json evidence-run/reports/review-dashboard.json

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest
