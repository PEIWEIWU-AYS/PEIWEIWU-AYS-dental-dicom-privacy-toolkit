name: Privacy or safety concern
description: Report a privacy, safety, or public repository boundary concern.
title: "[Privacy/Safety]: "
labels:
  - privacy
  - safety
body:
  - type: markdown
    attributes:
      value: |
        Do not paste sensitive details publicly. Use a high-level description and
        synthetic examples only.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Repository safety scan
        - DICOM metadata de-identification
        - Filename/path privacy
        - ZIP or clinic export intake
        - Pixel review or redaction
        - GitHub publishing
        - Documentation wording
        - Other
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Concern
      description: Describe the concern without including real patient data.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested mitigation
      description: Optional suggestion for safer behavior or wording.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include real patient data, credentials, private URLs, or clinical files.
          required: true
