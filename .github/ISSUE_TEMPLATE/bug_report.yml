name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach real DICOM, CBCT, radiographs,
        dental photos, PDFs, spreadsheets, clinic exports, consent forms, or PHI.
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command that failed.
      placeholder: ddpt evidence bundle . --out evidence-run
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Steps using synthetic data only.
      placeholder: |
        1. Run ddpt synthetic ...
        2. Run ddpt ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Python version, and ddpt version.
      placeholder: |
        macOS:
        Python:
        ddpt:
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not attach or paste real patient data, DICOM, images, exports, credentials, or private documents.
          required: true
